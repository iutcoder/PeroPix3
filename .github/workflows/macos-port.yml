name: macOS port check

on:
  push:
    branches: [macos-port, macos-port-dev]
  pull_request:
    branches: [macos-port]
  workflow_dispatch:

jobs:
  check-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Tauri shell
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-darwin

      - name: Test Tauri shell
        working-directory: src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Prepare bundled Python runtime
        run: bash scripts/prepare-macos-python.sh

      - name: Build macOS app bundle
        run: >-
          npx tauri build --bundles app
          --config '{"build":{"beforeBuildCommand":""}}'

      - name: Verify bundled runtime resources
        run: |
          APP=src-tauri/target/release/bundle/macos/PeroPix.app
          test -x "$APP/Contents/MacOS/peropix"
          test -x "$APP/Contents/Resources/python/bin/python3"
          "$APP/Contents/Resources/python/bin/python3" -c \
            'import fastapi, PIL, pydantic, uvicorn, onnxruntime'
          test -f "$APP/Contents/Resources/backend/server.py"
          test -f "$APP/Contents/Resources/models/censor/ntd11_anime_nsfw_segm_v5-variant1.onnx"
          test -f "$APP/Contents/Resources/public/tags.json"
          test -f "$APP/Contents/Resources/shared/terms.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = \
            "io.github.iutcoder.peropix3"
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        run: python3 -m pip install -r backend/requirements.txt

      - name: Import backend modules
        env:
          PEROPIX_DATA_DIR: ${{ runner.temp }}/peropix-data
          PEROPIX_RESOURCE_DIR: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'backend')
          import server
          import censor
          import files
          assert server.APP_DIR == Path('${{ runner.temp }}/peropix-data').resolve()
          assert server.INNER_DIR == Path('${{ github.workspace }}').resolve()
          print('macOS backend imports OK')
          PY
